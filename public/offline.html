<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stratego Offline</title>
    <style>
      body {
        margin: 0;
        font-family: Segoe UI, Tahoma, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .card {
        max-width: 30rem;
        background: #1e293b;
        padding: 1.5rem;
        border-radius: 14px;
        border: 1px solid #334155;
      }
      h1 {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You are offline</h1>
      <p>
        Stratego is available offline after its first successful load. If this is your first visit,
        reconnect briefly so assets can be cached.
      </p>
    </div>
  </body>
</html>
